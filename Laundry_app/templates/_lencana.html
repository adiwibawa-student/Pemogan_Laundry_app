{% macro status_bayar(s) -%}
  <span class="lencana {{ 'hijau' if s == 'Lunas' else 'kuning' }}">{{ s }}</span>
{%- endmacro %}

{% macro status_cucian(s) -%}
  {% if s == 'Siap diambil' %}
    <span class="lencana hijau">{{ s }}</span>
  {% elif s == 'Sedang diproses' %}
    <span class="lencana biru">{{ s }}</span>
  {% else %}
    <span class="lencana abu">{{ s }}</span>
  {% endif %}
{%- endmacro %}
